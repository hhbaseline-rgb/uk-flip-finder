name: Deal scan (every 15 minutes)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you press "Run workflow" by hand

permissions:
  contents: write         # needed to save which deals were already sent

concurrency:
  group: deal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find deals and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python -m flipfinder.scan
      - name: Save sent-deals list
        run: |
          git config user.name "flip-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "Update seen deals [skip ci]" && git pull --rebase && git push)
